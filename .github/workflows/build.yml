name: Build X3 Config Live

# Builds Config Live against the latest RXDK (clang, SDK, host tools) on Windows (the output is
# the same from any host) and packs it into the X3 BIOS image, then publishes it as the same
# rolling "latest" release the RXDK repos use: a push to main deletes and recreates the
# latest tag so /releases/latest is always this build. A v* tag is a fixed release. workflow_dispatch with release_tag is a
# prerelease. Pull requests build and upload artifacts, and do not publish.

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub Release with this tag (e.g. v1.0.0). Leave empty to build only.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 7-Zip's deflate packs the BIOS: preinstalled on the Windows runner

      - name: Stage RXDK clang, SDK, and host tools
        shell: pwsh
        run: ./scripts/stage-rxdk.ps1

      # build.sh: the XBE, then bios/pack_bios.py packs it into the X3 image
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh
          for f in out/ConfigLive.xbe out/X3_ConfigLive_2MB.bin; do
            [ -f "$f" ] || { echo "$f was not produced"; exit 1; }
          done

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp out/ConfigLive.xbe out/X3_ConfigLive_2MB.bin dist/

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: x3configlive
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  release:
    name: GitHub Release
    needs: [build]
    if: |
      github.event_name != 'pull_request' && (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') ||
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v5
        with:
          name: x3configlive
          path: dist

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          moving=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            prerelease=false
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            tag="${{ github.event.inputs.release_tag }}"
            prerelease=true
          else
            # Push to main: one moving "latest" release so /releases/latest stays current.
            tag="latest"
            prerelease=false
            moving=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "moving=$moving" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag (prerelease=$prerelease, moving=$moving)"

      - name: Move the 'latest' tag/release to this build
        if: steps.meta.outputs.moving == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo "${{ github.repository }}" --cleanup-tag --yes || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: X3 Config Live ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}
          body: |
            The Xecuter 3 Config Live app rebuilt with RXDK.

            - `ConfigLive.xbe`: Config Live as a normal XBE, to run from the hard drive or xemu; settings are kept in `E:\x3config.bin`
            - `X3_ConfigLive_2MB.bin`: the X3 3294 BIOS with the BIOS build of Config Live in its flash slot (only that slot differs from the stock image); settings are kept by the X3 BIOS itself, so the boot animation and autostart settings take effect

            The BIOS image has not been boot-tested on hardware yet. Flash it at your own risk, and keep a known-good bank.
          files: |
            dist/*
